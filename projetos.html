<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo-memc-m.png">
    <title>Projetos - Projeto Meninas e Mulheres Cientistas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], },
                    colors: {
                        memc: {
                            'roxo-escuro': '#23073A', 'roxo-medio': '#58288E',
                            'rosa': '#E1267A', 'azul': '#2F75E3',
                            'amarelo': '#FAC03E', 'verde': '#29A962',
                            'cinza-claro': '#A3A3A3', 'cinza-escuro': '#737373',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .custom-scrollbar { scrollbar-color: #E1267A #f5f5f5; }
        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f5f5f5; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E1267A; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #58288E; }
    </style>
</head>

<body class="bg-neutral-50 text-neutral-800 font-sans antialiased flex flex-col min-h-screen">

    <!-- CABEÇALHO -->
    <header class="bg-neutral-50/80 backdrop-blur-sm fixed top-0 left-0 right-0 z-10 shadow-lg">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="inline-block transition-transform hover:scale-105">
                <img src="img/logo-colorido2.png" alt="Logo Projeto Meninas e Mulheres Cientistas" class="h-16 w-auto object-contain">
            </a>
            
            <div class="space-x-4 md:space-x-6">
                <a href="index.html" target="_blank" class="text-neutral-700 hover:text-memc-rosa transition-colors font-semibold">Início</a>
                <a href="sobre.html" target="_blank" class="text-neutral-700 hover:text-memc-roxo-medio transition-colors font-semibold">Sobre</a>
                <a href="editais.html" target="_blank" class="text-neutral-700 hover:text-memc-verde transition-colors font-semibold">Editais</a>
                <a href="resultados.html" target="_blank" class="text-neutral-700 hover:text-memc-azul transition-colors font-semibold">Resultados</a>
                <a href="projetos.html" target="_blank" class="text-memc-amarelo font-semibold">Projetos</a>
                <a href="contatos.html" target="_blank" class="text-neutral-700 hover:text-memc-rosa transition-colors font-semibold">Contatos</a>
            </div>
        </nav>
    </header>

    <!-- CONTEÚDO PRINCIPAL (PROJETOS) -->
    <main class="pt-32 pb-20 flex-grow bg-neutral-100 px-6">
        <div class="container mx-auto max-w-6xl text-center">
            <h2 class="text-4xl font-bold mb-12 text-fuchsia-700">Projetos em Andamento</h2>
            
            <div id="grupos-container" class="flex flex-wrap justify-center gap-8 items-stretch">
                <!-- Os cards serão injetados aqui pelo JavaScript -->
            </div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="bg-neutral-100 py-8 text-center mt-auto border-t border-neutral-200">
        <div class="container mx-auto px-6">
            <p class="text-neutral-600">
                Feito com ❤️ por Meninas e Mulheres Cientistas 2026
            </p>
        </div>
    </footer>

    <!-- SCRIPT DE GERAÇÃO DOS CARDS DE PROJETOS -->
    <script>
        const grupos = [
            {
                numero: 1,
                nome: "Projeto Cientista por um Dia",
                github: "#"
            },
            {
                numero: 2,
                nome: "Centro de Ensino Integrado de Química",
                github: "#"
            },
            {
                numero: 3,
                nome: "Projeto Semeando Cientistas",
                github: "#"
            },
            {
                numero: 4,
                nome: "Projeto Pequenas Cientistas",
                github: "#"
            }
        ];

        function criarCardGrupo(grupo) {
            return `
                <div class="bg-white rounded-lg shadow-xl overflow-hidden transform transition-transform hover:-translate-y-2 flex flex-col justify-between p-6 text-center h-full w-full md:w-64">
                    <div>
                        <h3 class="text-2xl font-bold mb-2 text-neutral-800">Grupo ${grupo.numero}</h3>
                        <p class="text-neutral-500 mb-4 px-2">
                            ${grupo.nome}
                        </p>
                    </div>
                    <div class="mt-auto">
                        <a href="${grupo.github}" ${grupo.github.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''} class="text-fuchsia-700 hover:text-fuchsia-600 font-medium">Ver no GitHub</a>
                    </div>
                </div>
            `;
        }

        function renderizarGrupos() {
            const container = document.getElementById('grupos-container');
            container.innerHTML = grupos.map(grupo => criarCardGrupo(grupo)).join('');
        }

        document.addEventListener('DOMContentLoaded', renderizarGrupos);
    </script>
</body>
</html>
